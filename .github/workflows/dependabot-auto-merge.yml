name: Dependabot auto-merge

# Approves and merges a Dependabot pull request once its "Build LaTeX document" run is green.
#
# Why workflow_run instead of GitHub's native auto-merge: this repo has no ruleset or branch
# protection requiring a status check, so `gh pr merge --auto` would have nothing to wait for
# and would merge a PR the moment it opened, before CI ran. Keying off the build's completion
# makes the build the real gate -- this job only acts once "Build LaTeX document" has
# concluded success on a Dependabot branch.
#
# The build runs on `push` (not `pull_request`): Dependabot branches live in this repository,
# so pushing one is what starts CI for the PR.
#
# The job never checks out or runs the PR's code; it only talks to the API using the head
# branch name, so the write tokens are never exposed to unreviewed code.
#
# A PR that is behind main is never merged, only rebased: squashing a stale branch would merge
# a tree no build ran on. Dependabot rebases by itself only on a conflict, so a branch that is
# merely behind is asked to with "@dependabot rebase"; the fresh commit's build brings us back.
#
# GITHUB_TOKEN can't do the asking: Dependabot answers github-actions[bot] with "only users
# with push access can use that command". So the comment is posted with DEPENDABOT_REBASE_TOKEN,
# a fine-grained PAT of the repo owner's on this repository with only Pull requests read/write.
# Merging stays on GITHUB_TOKEN, which is fine for a branch that is up to date; on a stale one
# it would be refused anyway, since these bumps touch .github/workflows/ ("refusing to allow a
# GitHub App to create or update workflow ... without `workflows` permission").
# Without the secret, the first bump of a batch merges and the rest wait for a manual rebase.
on:
  workflow_run:
    workflows: ["Build LaTeX document"]
    types: [completed]
  # A human push to main leaves every open bump behind. A merge done by this workflow fires no
  # push -- GITHUB_TOKEN events never start runs -- so auto-merge sweeps after merging instead.
  push:
    branches: [main]

permissions: {}

# Two Dependabot builds can finish at the same moment; serialise per branch.
concurrency:
  group: dependabot-auto-merge-${{ github.event.workflow_run.head_branch || 'sweep' }}
  cancel-in-progress: false

jobs:
  auto-merge:
    # Only a build of a Dependabot branch that actually passed.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - name: Approve and merge if the build is green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REBASE_TOKEN: ${{ secrets.DEPENDABOT_REBASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # Ask Dependabot to rebase PR $1 -- as the repo owner, the only one it listens to.
          rebase() {
            if [ -z "$REBASE_TOKEN" ]; then
              echo "::warning::#$1 is behind main and DEPENDABOT_REBASE_TOKEN is not set; rebase it by hand."
              return
            fi
            GH_TOKEN=$REBASE_TOKEN gh pr comment "$1" --body '@dependabot rebase'
            echo "::notice::Asked Dependabot to rebase #$1."
          }

          # The branch, not github.event.workflow_run.pull_requests: that array is empty in
          # several documented cases, and a Dependabot branch always lives in this repository.
          pr=$(gh pr list --head "$BRANCH" --state open --json number,author \
                 --jq '.[] | select(.author.login == "app/dependabot") | .number')
          if [ -z "$pr" ]; then
            echo "::notice::No open Dependabot PR for $BRANCH; nothing to do."
            exit 0
          fi

          # The green run must be for the PR's current head; a stale run for an older commit
          # says nothing about what would be merged now.
          head=$(gh pr view "$pr" --json headRefOid --jq '.headRefOid')
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "::notice::PR #$pr head moved to $head; waiting for its own build."
            exit 0
          fi

          # Re-read the whole rollup rather than trusting only the run that woke us, so a second
          # red check on the PR still blocks the merge. A finished check reports conclusion; a
          # commit status reports state; SKIPPED/NEUTRAL count as non-blocking. Computed inside
          # gh's own jq so the step needs no system jq on the runner.
          verdict=$(gh pr view "$pr" --json statusCheckRollup --jq '
            [ .statusCheckRollup[] | (.conclusion // .state // .status // "PENDING") | ascii_upcase ]
            | map(select(. != "SKIPPED" and . != "NEUTRAL"))
            | if length == 0 then "EMPTY"
              elif all(. == "SUCCESS") then "SUCCESS"
              else "BLOCKED" end')
          if [ "$verdict" != "SUCCESS" ]; then
            echo "::notice::PR #$pr is not fully green ($verdict); leaving it."
            exit 0
          fi

          # Behind main: rebase rather than merge (see the top of this file).
          behind=$(gh api "repos/$GH_REPO/compare/main...$BRANCH" --jq '.behind_by')
          if [ "$behind" -gt 0 ]; then
            rebase "$pr"
            exit 0
          fi

          # A conflicting PR (base moved under it) can't be merged; Dependabot will rebase it
          # and the new build re-triggers this workflow.
          mergeable=$(gh pr view "$pr" --json mergeable --jq '.mergeable')
          if [ "$mergeable" != "MERGEABLE" ]; then
            echo "::notice::PR #$pr is $mergeable; waiting for a rebase."
            exit 0
          fi

          # Approve once. Dependabot can't approve its own PR; github-actions supplies the
          # review. Idempotent so a re-run never stacks reviews.
          approved=$(gh pr view "$pr" --json reviews \
                       --jq '[.reviews[] | select(.author.login == "github-actions" and .state == "APPROVED")] | length')
          if [ "$approved" -eq 0 ]; then
            gh pr review "$pr" --approve \
              --body 'Build is green. Approved automatically: for a dependency bump, CI is the review.'
          fi

          gh pr merge "$pr" --squash --delete-branch
          echo "::notice::Merged Dependabot PR #$pr."

          # Every other open bump is now behind; this merge fires no push run to notice that.
          gh pr list --author app/dependabot --state open --json number --jq '.[].number' |
          while read -r n; do rebase "$n"; done

  sweep:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Ask Dependabot to rebase bumps that are behind main
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_REBASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::DEPENDABOT_REBASE_TOKEN is not set; Dependabot ignores rebase requests from GITHUB_TOKEN."
            exit 0
          fi

          gh pr list --author app/dependabot --state open --json number,headRefName \
               --jq '.[] | "\(.number) \(.headRefName)"' |
          while read -r n branch; do
            behind=$(gh api "repos/$GH_REPO/compare/main...$branch" --jq '.behind_by')
            if [ "$behind" -gt 0 ]; then
              gh pr comment "$n" --body '@dependabot rebase'
              echo "::notice::Asked Dependabot to rebase #$n ($behind behind main)."
            fi
          done
